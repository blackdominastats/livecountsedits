name: Clean up legacy fire interval references

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy fire interval references
        run: |
          python3 <<'PY'
          from pathlib import Path
          js_path = Path('top50/index.js')
          js = js_path.read_text()
          old = "    document.getElementById('intervalsPerUpdate').value = data.fireIcons.intervalsPerUpdate || 1;"
          new = "    document.getElementById('fireUpdateMin').value = Math.max(1, parseFloat(data.fireIcons.updateTimeMin) || 1);\n    document.getElementById('fireUpdateMax').value = Math.max(parseFloat(data.fireIcons.updateTimeMin) || 1, parseFloat(data.fireIcons.updateTimeMax) || 1);"
          if old not in js:
              raise SystemExit('Legacy menu reference not found')
          js = js.replace(old, new, 1)
          old2 = "            'intervalsPerUpdate': 1,\n"
          new2 = "            'updateTimeMin': 2,\n            'updateTimeMax': 2,\n"
          if old2 not in js:
              raise SystemExit('Legacy fire default not found')
          js = js.replace(old2, new2, 1)
          js_path.write_text(js)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top50/index.js
          git rm .github/workflows/one-time-fire-icons-cleanup.yml
          git commit -m "Remove remaining legacy fire interval references"
          git push origin main
          gh workflow run static.yml --ref main
